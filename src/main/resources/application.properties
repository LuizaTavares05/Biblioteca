spring.application.name=biblioteca
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/trabalho3
spring.datasource.username=postgres
spring.datasource.password=123456

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

dominio.openapi.dev-url=http://localhost:8080
dominio.openapi.prod-url=https://www.meudominio.com.br

# JWT - chave secreta e tempo de expiração (em milissegundos = 24 horas)
auth.jwt-secret=chave-secreta-biblioteca-serratec-muito-segura-2024-xpto
auth.jwt-expiration=86400000

# Log de debug do Spring Security (para diagnosticar o 403)
logging.level.org.springframework.security=DEBUG